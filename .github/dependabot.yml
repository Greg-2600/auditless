version: 2
updates:
  # Enable version updates for Python dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
    open-pull-requests-limit: 5
    reviewers:
      - Greg-2600
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
    pull-request-branch-name:
      separator: "/"

  # Enable version updates for Docker
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
    reviewers:
      - Greg-2600
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "chore(docker):"

  # Keep pinned GitHub Actions (SHA + version comment) fresh
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    reviewers:
      - Greg-2600
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(actions):"
