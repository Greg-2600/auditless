name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            See [CHANGELOG.md](../../blob/${{ github.ref_name }}/CHANGELOG.md) for release notes.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: no PyPI job yet — publishing needs a PYPI_API_TOKEN secret
  # and a decision on the distribution name. Docker images (below) are
  # the supported distribution channel; `python -m build` is CI-checked
  # in the test job via `pip install -e .`.
  publish-docker:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SBOM attestations land on the image.
          provenance: true
          sbom: true

      - name: Resolve lowercase digest ref
        id: img
        run: |
          echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX JSON) for cosign attestation
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ steps.img.outputs.ref }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          artifact-name: sbom-spdx

  sign-image:
    runs-on: ubuntu-latest
    needs: publish-docker
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Login to GHCR (cosign pushes signature)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve lowercase digest ref
        id: img
        run: |
          echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')@${{ needs.publish-docker.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Download SBOM artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sbom-spdx
          path: ./sbom

      - name: Sign image (keyless OIDC)
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
        run: cosign sign --yes "$IMAGE"

      - name: Attest SBOM (keyless OIDC)
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
        run: cosign attest --yes --predicate ./sbom/sbom.spdx.json --type spdxjson "$IMAGE"

  verify-release:
    runs-on: ubuntu-latest
    needs: [publish-docker, sign-image]
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Resolve lowercase digest ref
        id: img
        run: |
          echo "ref=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')@${{ needs.publish-docker.outputs.digest }}" >> "$GITHUB_OUTPUT"

      - name: Verify signature, provenance, and SBOM
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${REPO}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"
          # Buildx provenance attestations are verified with slsa-verifier
          # (cosign verify-attestation only reads cosign-made attestations).
          curl -sL -o /tmp/slsa-verifier \
            https://github.com/slsa-framework/slsa-verifier/releases/download/v2.7.1/slsa-verifier-linux-amd64
          chmod +x /tmp/slsa-verifier
          /tmp/slsa-verifier verify-image "$IMAGE" \
            --source-uri "github.com/${REPO}" \
            --source-tag "${{ github.ref_name }}"
          cosign verify-attestation --type spdxjson \
            --certificate-identity-regexp "https://github.com/${REPO}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"
          cosign download sbom "$IMAGE" > /tmp/sbom.json
          python3 -c "import json; d=json.load(open('/tmp/sbom.json')); print('sbom packages:', len(d.get('packages', [])))"

      - name: Boot smoke test of the signed image
        env:
          IMAGE: ${{ steps.img.outputs.ref }}
        run: |
          docker run --rm "$IMAGE" --help | head -3
