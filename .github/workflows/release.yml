name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            See [CHANGELOG.md](../../blob/${{ github.ref_name }}/CHANGELOG.md) for release notes.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # NOTE: no PyPI job yet — publishing needs a PYPI_API_TOKEN secret
  # and a decision on the distribution name. Docker images (below) are
  # the supported distribution channel; `python -m build` is CI-checked
  # in the test job via `pip install -e .`.
  publish-docker:
    runs-on: ubuntu-latest
    needs: create-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SBOM attestations land on the image.
          provenance: true
          sbom: true

  sign-image:
    runs-on: ubuntu-latest
    needs: publish-docker
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless OIDC)
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish-docker.outputs.digest }}
        run: cosign sign --yes "$IMAGE"

  verify-release:
    runs-on: ubuntu-latest
    needs: sign-image
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Verify signature, provenance, and SBOM
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish-docker.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${REPO}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"
          cosign verify-attestation --type slsaprovenance \
            --certificate-identity-regexp "https://github.com/${REPO}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "$IMAGE"
          cosign download sbom "$IMAGE" > /tmp/sbom.json
          python3 -c "import json; d=json.load(open('/tmp/sbom.json')); print('sbom packages:', len(d.get('packages', [])))"

      - name: Boot smoke test of the signed image
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.publish-docker.outputs.digest }}
        run: |
          docker run --rm "$IMAGE" --help | head -3
