name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check linux_health/ tests/ auditless.py

      - name: Format check with Black
        run: |
          black --check linux_health/ tests/ auditless.py

      - name: Lint with Pylint (10.00/10 gate)
        run: |
          pylint linux_health/ auditless.py --fail-under=10.0

      - name: Type check with Mypy
        run: |
          mypy linux_health/ auditless.py

      - name: Build distribution (validates release packaging)
        run: |
          pip install build
          python -m build

      - name: Security gate with Bandit (HIGH only)
        run: |
          bandit -r linux_health/ auditless.py -q -lll

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Generate coverage report
        run: |
          pytest tests/ --cov=linux_health --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Bandit security checks
        run: |
          pip install bandit
          bandit -r linux_health/ -f json -o bandit-report.json || true

      - name: Check dependencies with Safety
        run: |
          pip install safety
          safety check --json || true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: End-to-end suite (containers + real SSH)
        run: |
          AUDITLESS_E2E=1 python -m pytest tests/test_e2e.py -v --tb=short
        env:
          AUDITLESS_E2E: "1"

  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      # Hermetic orchestration gate (no network): the parallel speedup
      # ratio is hardware-independent, so a >10% scan-time regression in
      # orchestration fails here without flaky absolute-time asserts.
      # The docker-based fleet benchmark stays manual (scripts/README.md).
      - name: Parallel speedup gate (>= 2.0x, i.e. no >50% regression)
        run: |
          python scripts/bench_checks.py --latency 0.05 --jobs 8 --repeats 3 --check 2.0
