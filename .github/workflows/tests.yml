name: Tests

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint with Ruff
        run: |
          ruff check linux_health/ tests/

      - name: Format check with Black
        run: |
          black --check linux_health/ tests/

      - name: Lint with Pylint (10.00/10 gate)
        run: |
          pylint linux_health/ --fail-under=10.0

      - name: Type check with Mypy
        run: |
          mypy linux_health/

      - name: Security gate with Bandit (HIGH only)
        run: |
          bandit -r linux_health/ -q -lll

      - name: Run tests with pytest
        run: |
          pytest tests/ -v --tb=short

      - name: Generate coverage report
        run: |
          pytest tests/ --cov=linux_health --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Bandit security checks
        run: |
          pip install bandit
          bandit -r linux_health/ -f json -o bandit-report.json || true

      - name: Check dependencies with Safety
        run: |
          pip install safety
          safety check --json || true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: End-to-end suite (containers + real SSH)
        run: |
          AUDITLESS_E2E=1 python -m pytest tests/test_e2e.py -v --tb=short
        env:
          AUDITLESS_E2E: "1"
