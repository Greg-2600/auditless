services:
  auditless:
    build: .
    image: auditless:latest
    container_name: auditless
    # Persistent UI: serves the dashboard with SQLite + keys on a volume.
    # Bind/port via env (defaults: all interfaces inside the container,
    # published to host loopback only — safe by default):
    #   AUDITLESS_HOST=0.0.0.0 AUDITLESS_PORT=8080 docker compose up -d
    command: ["--serve"]
    ports:
      - "127.0.0.1:${AUDITLESS_PORT:-8080}:8080"
    environment:
      - PYTHONUNBUFFERED=1
      - AUDITLESS_DATA_DIR=/app/data
      - AUDITLESS_HOST=${AUDITLESS_HOST:-0.0.0.0}
      - AUDITLESS_PORT=${AUDITLESS_PORT:-8080}
      # Bearer token for the API/UI. Generate one and export it or put it
      # in a .env file next to this compose file (gitignored, never commit):
      #   openssl rand -hex 32
      - AUDITLESS_TOKEN=${AUDITLESS_TOKEN:-}
    volumes:
      - auditless-data:/app/data
      - ./reports:/app/reports
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-m", "linux_health", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3

  # One-shot CLI scans (no persistence needed):
  #   docker compose run --rm --no-deps auditless \
  #     192.168.1.100 admin password --format md --output /reports/scan.md

volumes:
  auditless-data:
